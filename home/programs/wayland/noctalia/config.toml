[backdrop]
enabled = true

[bar.default]
background_opacity = 0.90000000000000002
end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session" ]
font_family = "IBM Plex Mono"
margin_edge = 0
margin_ends = 0
radius = 0
shadow = false
start = [ "workspaces", "sysmon", "media", "cat" ]

[calendar]
enabled = true

[config]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 878.0
    cy = 978.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 749.5
    cy = 323.5
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        clock_style = "digital"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 877.5
    cy = 526.5
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        hide_when_no_media = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 1017.5
    cy = 323.5
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        show_forecast = true

[nightlight]
enabled = true

[osd]
position = "top_right"

    [osd.kinds]
    brightness = false
    volume = false

[plugins]
enabled = [ "noctalia/bongocat" ]

[shell]
avatar_path = "/home/hmanhng/Pictures/.face"
clipboard_enabled = false
font_family = "DankMono Nerd Font Mono"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true

    [shell.panel]
    open_near_click_control_center = true
    shadow = false

[templates]

[theme]
source = "wallpaper"

[wallpaper]
directory = "/home/hmanhng/Pictures/Wallpapers"

[widget.cat]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.control-center]
glyph = "snowflake"
icon_color = "primary"

[widget.media]
hide_when_no_media = true

[widget.tray]
drawer = true
pinned = [ "Fcitx" ]
